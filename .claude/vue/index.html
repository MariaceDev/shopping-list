<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de casa · Vue + Vuetify</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/vuetify@3.7.4/dist/vuetify.min.css" rel="stylesheet">
<style>html,body{margin:0;background:#e4e4e4}</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vuetify@3.7.4/dist/vuetify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue3-sfc-loader@0.9.5/dist/vue3-sfc-loader.js"></script>
<script>
// Vista previa sin build: carga ListaCompra.vue directamente
const { loadModule } = window['vue3-sfc-loader'];
const options = {
  moduleCache: { vue: Vue },
  getFile: url => fetch(url).then(r => r.ok ? r.text() : Promise.reject(r)),
  addStyle(css) { const s = document.createElement('style'); s.textContent = css; document.head.appendChild(s); }
};
const vuetify = Vuetify.createVuetify({
  theme: { defaultTheme: 'casa', themes: { casa: { dark: false, colors: {
    background: '#fafafa', surface: '#ffffff', primary: '#086375', secondary: '#3C1642', accent: '#AFFC41'
  } } } }
});
Vue.createApp(Vue.defineAsyncComponent(() => loadModule('./ListaCompra.vue', options)))
  .use(vuetify).mount('#app');
</script>
</body>
</html>
